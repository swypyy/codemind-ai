<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090810">
<title>CodeMind AI | Swypyy</title>

<!-- Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- HTML sanitization -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<!-- Code highlighting -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/css.min.js"></script>

<style>
:root {
  --bg: #090810;
  --sidebar: #0e0c18;
  --surface: #151221;
  --surface2: #1c172e;
  --border: #29243b;
  --purple: #7c3aed;
  --light: #a78bfa;
  --text: #f4f0ff;
  --muted: #9690aa;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, textarea { font: inherit; }
button { cursor: pointer; }

.app {
  display: flex;
  width: 100%;
  height: 100dvh;
}

/* SIDEBAR */

.sidebar {
  width: 265px;
  min-width: 265px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 17px 13px;
  z-index: 20;
  transition: transform .25s;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 5px 7px 23px;
}

.logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: #24183d;
  color: var(--light);
  font-weight: bold;
}

.brand-name {
  font-weight: bold;
  font-size: 16px;
}

.brand-name small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  font-weight: normal;
  margin-top: 3px;
  letter-spacing: 1px;
}

.new-chat {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  text-align: left;
  display: flex;
  gap: 10px;
  align-items: center;
}

.new-chat:hover,
.history-item:hover {
  background: var(--surface2);
}

.section-label {
  margin: 25px 8px 10px;
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  padding: 10px;
  border-radius: 9px;
  color: #c9c3d8;
  font-size: 12px;
  cursor: pointer;
  margin-bottom: 3px;
}

.history-item.active {
  background: #241b38;
  color: white;
}

.history-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  flex: 1;
}

.delete-chat {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 3px 5px;
  font-size: 15px;
  opacity: 0;
}

.history-item:hover .delete-chat {
  opacity: 1;
}

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding: 15px 8px 2px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.sidebar-bottom strong { color: var(--light); }

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 23px;
  border-bottom: 1px solid var(--border);
}

.top-left {
  display: flex;
  align-items: center;
  gap: 13px;
}

.menu-button {
  display: none;
  background: transparent;
  border: 0;
  color: var(--text);
  font-size: 21px;
}

.model-name {
  font-size: 14px;
  font-weight: bold;
}

.save-status {
  color: #8de0a5;
  font-size: 11px;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.chat-inner {
  width: 100%;
  max-width: 850px;
  min-height: 100%;
  margin: auto;
  padding: 30px 25px;
}

.welcome {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.welcome-logo {
  width: 55px;
  height: 55px;
  border-radius: 17px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#24183d,#39235d);
  color: #c4a8ff;
  font-size: 23px;
  margin-bottom: 22px;
}

.welcome h1 {
  font-size: clamp(25px,4vw,36px);
  margin: 0 0 12px;
}

.welcome h1 span { color: var(--light); }

.welcome p {
  max-width: 430px;
  color: var(--muted);
  line-height: 1.7;
  font-size: 14px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
  width: 100%;
  max-width: 570px;
  margin-top: 25px;
}

.suggestion {
  text-align: left;
  padding: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  color: var(--text);
}

.suggestion:hover {
  background: var(--surface2);
  border-color: var(--light);
}

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}

.suggestion span {
  color: var(--muted);
  font-size: 11px;
}

/* MESSAGES */

.message {
  display: flex;
  width: 100%;
  margin-bottom: 27px;
  animation: appear .2s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  justify-content: flex-end;
}

.user-bubble {
  max-width: 78%;
  padding: 12px 17px;
  border-radius: 17px 17px 4px 17px;
  background: #30234b;
  color: #f1eaff;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.bot {
  justify-content: flex-start;
}

.bot-content {
  width: 100%;
  min-width: 0;
  font-size: 14px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.bot-content p { margin: 0 0 15px; }
.bot-content h1,
.bot-content h2,
.bot-content h3 {
  margin: 23px 0 10px;
  line-height: 1.4;
}

.bot-content h1 { font-size: 22px; }
.bot-content h2 { font-size: 19px; }
.bot-content h3 { font-size: 16px; }

.bot-content ul,
.bot-content ol {
  padding-left: 25px;
  margin: 10px 0 18px;
}

.bot-content li { margin: 5px 0; }

.bot-content blockquote {
  border-left: 3px solid var(--purple);
  margin: 15px 0;
  padding: 5px 15px;
  color: #c5bdd6;
  background: #151221;
}

.bot-content a {
  color: var(--light);
}

.bot-content table {
  border-collapse: collapse;
  display: block;
  overflow-x: auto;
  max-width: 100%;
}

.bot-content th,
.bot-content td {
  border: 1px solid var(--border);
  padding: 9px 12px;
  text-align: left;
}

.bot-content th { background: var(--surface2); }

.bot-content code:not(pre code) {
  background: #211a31;
  color: #d6c5ff;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: .9em;
}

.bot-content pre {
  position: relative;
  background: #100e18;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin: 16px 0;
  overflow: auto;
  max-width: 100%;
}

.bot-content pre code {
  display: block;
  padding: 19px;
  padding-top: 43px;
  font-family: Consolas, monospace;
  font-size: 13px;
  line-height: 1.65;
  white-space: pre;
}

.copy-code {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #29213a;
  color: #d9ccf5;
  border: 1px solid #403653;
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 11px;
  z-index: 2;
}

.copy-code:hover { background: #403052; }

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 8px 0;
}

/* COMPOSER */

.composer-area {
  flex-shrink: 0;
  padding: 12px 20px 17px;
  background: linear-gradient(transparent,var(--bg) 18%);
}

.composer-wrap {
  max-width: 850px;
  margin: auto;
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px 11px 10px 17px;
  background: var(--surface);
  border: 1px solid #39314f;
  border-radius: 17px;
}

.composer:focus-within { border-color: var(--light); }

textarea {
  flex: 1;
  min-width: 0;
  max-height: 180px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 7px 0;
  font-size: 14px;
  line-height: 1.5;
}

textarea::placeholder { color: #777087; }

.send-button {
  width: 39px;
  height: 39px;
  flex-shrink: 0;
  border: 0;
  border-radius: 11px;
  background: var(--purple);
  color: white;
  font-size: 20px;
}

.send-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.composer-note {
  text-align: center;
  color: #716b81;
  font-size: 10px;
  margin-top: 10px;
}

/* MOBILE */

.overlay { display: none; }

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: 270px;
    transform: translateX(-100%);
  }

  .sidebar.open { transform: translateX(0); }

  .overlay.show {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 10;
  }

  .menu-button { display: block; }

  .topbar {
    height: 55px;
    padding: 0 13px;
  }

  .chat-inner { padding: 22px 15px; }
  .welcome { min-height: 60vh; }
  .suggestions { grid-template-columns: 1fr; }
  .composer-area { padding: 9px 10px 12px; }
  .user-bubble { max-width: 90%; }
  .bot-content { font-size: 13px; }
  .bot-content pre code { font-size: 12px; }
  .delete-chat { opacity: 1; }
}
</style>
</head>

<body>
<div class="app">

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="logo">&lt;/&gt;</div>
    <div class="brand-name">
      CodeMind AI
      <small>POWERED BY SWYPYY</small>
    </div>
  </div>

  <button class="new-chat" id="newChat">
    <span>＋</span> New chat
  </button>

  <div class="section-label">Your chats</div>
  <div class="history-list" id="historyList"></div>

  <div class="sidebar-bottom">
    <strong>CodeMind AI</strong><br>
    Your personal coding assistant.
  </div>

</aside>

<main class="main">

  <header class="topbar">
    <div class="top-left">
      <button class="menu-button" id="menuButton">☰</button>
      <div class="model-name">CodeMind AI</div>
    </div>
    <div class="save-status" id="saveStatus">● Saved locally</div>
  </header>

  <section class="chat-area" id="chatArea">
    <div class="chat-inner" id="chatInner">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">&lt;/&gt;</div>

        <h1>What are we <span>building?</span></h1>

        <p>
          Your programming companion for coding,
          debugging and software development.
        </p>

        <div class="suggestions">
          <button class="suggestion"
            data-prompt="Explain Python variables with examples.">
            <strong>Learn programming</strong>
            <span>Understand coding concepts</span>
          </button>

          <button class="suggestion"
            data-prompt="Help me debug my JavaScript code.">
            <strong>Debug code</strong>
            <span>Find and fix programming errors</span>
          </button>

          <button class="suggestion"
            data-prompt="Create a simple responsive HTML website.">
            <strong>Build a website</strong>
            <span>Start a coding project</span>
          </button>

          <button class="suggestion"
            data-prompt="Explain how APIs work with an example.">
            <strong>Understand APIs</strong>
            <span>Learn how software connects</span>
          </button>
        </div>
      </div>

    </div>
  </section>

  <section class="composer-area">
    <div class="composer-wrap">
      <form class="composer" id="chatForm">

        <textarea id="userInput"
          rows="1"
          placeholder="Message CodeMind AI..."
          autocomplete="off"
          required></textarea>

        <button class="send-button"
          id="sendButton"
          type="submit">↑</button>

      </form>

      <div class="composer-note">
        AI can make mistakes. Review generated code before using it.
      </div>
    </div>
  </section>

</main>
</div>

<script>
/* CONFIGURATION */

const API_URL = "https://codemind-ai-api.swypyy.workers.dev";
const STORAGE_KEY = "codemind_saved_chats_v1";

/* ELEMENTS */

const form = document.getElementById("chatForm");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const chatInner = document.getElementById("chatInner");
const chatArea = document.getElementById("chatArea");
const historyList = document.getElementById("historyList");
const saveStatus = document.getElementById("saveStatus");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

/* STATE */

let chats = loadChats();
let activeChatId = null;
let isSending = false;

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

/* STORAGE */

function loadChats() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : [];
  } catch {
    return [];
  }
}

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    saveStatus.textContent = "● Saved locally";
    saveStatus.style.color = "#8de0a5";
  } catch (error) {
    saveStatus.textContent = "● Storage full";
    saveStatus.style.color = "#f0a0a0";
  }
}

function getActiveChat() {
  return chats.find(chat => chat.id === activeChatId);
}

function createChat() {
  const chat = {
    id: makeId(),
    title: "New chat",
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };

  chats.unshift(chat);
  activeChatId = chat.id;
  saveChats();
  renderHistory();
  renderChat();
  closeSidebar();
}

/* TITLES */

function makeTitle(text) {
  const clean = text.replace(/\s+/g, " ").trim();
  return clean.length > 35
    ? clean.slice(0, 35).trim() + "..."
    : clean || "New chat";
}

/* SIDEBAR HISTORY */

function renderHistory() {
  historyList.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item" +
      (chat.id === activeChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title;

    const remove = document.createElement("button");
    remove.className = "delete-chat";
    remove.textContent = "×";
    remove.title = "Delete chat";

    remove.addEventListener("click", event => {
      event.stopPropagation();
      deleteChat(chat.id);
    });

    item.appendChild(title);
    item.appendChild(remove);

    item.addEventListener("click", () => {
      activeChatId = chat.id;
      renderHistory();
      renderChat();
      closeSidebar();
    });

    historyList.appendChild(item);
  });
}

/* CHAT RENDERING */

function renderChat() {
  chatInner.innerHTML = "";

  const chat = getActiveChat();

  if (!chat || chat.messages.length === 0) {
    showWelcome();
    return;
  }

  chat.messages.forEach(message => {
    addMessage(message.role, message.content);
  });

  highlightAllCode();
  scrollToBottom();
}

function showWelcome() {
  chatInner.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-logo">&lt;/&gt;</div>
      <h1>What are we <span>building?</span></h1>
      <p>Your programming companion for coding,
      debugging and software development.</p>

      <div class="suggestions">
        <button class="suggestion"
          data-prompt="Explain Python variables with examples.">
          <strong>Learn programming</strong>
          <span>Understand coding concepts</span>
        </button>

        <button class="suggestion"
          data-prompt="Help me debug my JavaScript code.">
          <strong>Debug code</strong>
          <span>Find and fix programming errors</span>
        </button>

        <button class="suggestion"
          data-prompt="Create a simple responsive HTML website.">
          <strong>Build a website</strong>
          <span>Start a coding project</span>
        </button>

        <button class="suggestion"
          data-prompt="Explain how APIs work with an example.">
          <strong>Understand APIs</strong>
          <span>Learn how software connects</span>
        </button>
      </div>
    </div>
  `;
}

function addMessage(role, content) {
  const message = document.createElement("div");
  message.className = "message " + role;

  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "user-bubble";
    bubble.textContent = content;
    message.appendChild(bubble);
  } else {
    const answer = document.createElement("div");
    answer.className = "bot-content";

    const html = marked.parse(content || "");
    answer.innerHTML = DOMPurify.sanitize(html);

    message.appendChild(answer);
  }

  chatInner.appendChild(message);

  if (role === "bot") {
    addCopyButtons(message);
    highlightAllCode();
  }

  scrollToBottom();
  return message;
}

/* CODE HIGHLIGHTING */

function highlightAllCode() {
  document.querySelectorAll(".bot-content pre code").forEach(block => {
    if (window.hljs && !block.dataset.highlighted) {
      hljs.highlightElement(block);
    }
  });
}

function addCopyButtons(message) {
  message.querySelectorAll("pre").forEach(pre => {
    const button = document.createElement("button");
    button.className = "copy-code";
    button.textContent = "Copy";

    button.addEventListener("click", async () => {
      const code = pre.querySelector("code");
      if (!code) return;

      try {
        await navigator.clipboard.writeText(code.innerText);
        button.textContent = "Copied!";
        setTimeout(() => button.textContent = "Copy", 1500);
      } catch {
        button.textContent = "Copy failed";
      }
    });

    pre.appendChild(button);
  });
}

/* TYPING INDICATOR */

function showTyping() {
  const message = document.createElement("div");
  message.className = "message bot";
  message.id = "typingMessage";

  message.innerHTML = `
    <div class="bot-content">
      <div class="typing">Thinking...</div>
    </div>
  `;

  chatInner.appendChild(message);
  scrollToBottom();
}

function removeTyping() {
  document.getElementById("typingMessage")?.remove();
}

/* SEND MESSAGE */

async function sendMessage(question) {
  if (isSending || !question.trim()) return;

  if (!activeChatId) createChat();

  const chat = getActiveChat();
  if (!chat) return;

  isSending = true;
  sendButton.disabled = true;

  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const userMessage = {
    role: "user",
    content: question
  };

  chat.messages.push(userMessage);

  if (chat.messages.filter(m => m.role === "user").length === 1) {
    chat.title = makeTitle(question);
  }

  chat.updatedAt = Date.now();

  saveChats();
  renderHistory();
  addMessage("user", question);

  input.value = "";
  input.style.height = "auto";

  showTyping();

  try {
    const response = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: chat.messages.slice(-12)
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success || !data.answer) {
      throw new Error(data.error || "The AI could not respond.");
    }

    removeTyping();

    chat.messages.push({
      role: "assistant",
      content: data.answer
    });

    chat.updatedAt = Date.now();

    saveChats();
    addMessage("bot", data.answer);
    renderHistory();

  } catch (error) {
    removeTyping();

    addMessage(
      "bot",
      "I couldn't connect to the AI service. Please try again.\n\nError: " +
      error.message
    );

    // Keep the user message saved so it is not lost.
    saveChats();

  } finally {
    isSending = false;
    sendButton.disabled = false;
    input.focus();
  }
}

/* FORM */

form.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value.trim());
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});

/* SUGGESTIONS */

document.addEventListener("click", event => {
  const button = event.target.closest(".suggestion");
  if (!button) return;

  input.value = button.dataset.prompt;
  sendMessage(input.value.trim());
});

/* NEW CHAT */

document.getElementById("newChat").addEventListener("click", () => {
  if (isSending) return;
  createChat();
  input.focus();
});

/* DELETE CHAT */

function deleteChat(id) {
  if (isSending && id === activeChatId) return;

  chats = chats.filter(chat => chat.id !== id);

  if (activeChatId === id) {
    activeChatId = null;
  }

  saveChats();
  renderHistory();
  renderChat();
}

/* MOBILE SIDEBAR */

function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

document.getElementById("menuButton").addEventListener("click", () => {
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
});

overlay.addEventListener("click", closeSidebar);

/* STARTUP */

function scrollToBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

if (chats.length > 0) {
  activeChatId = chats[0].id;
}

renderHistory();
renderChat();
</script>

</body>
</html>
